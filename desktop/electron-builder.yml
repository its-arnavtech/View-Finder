# `npm run dist` builds the Windows installer into dist/.
appId: com.viewfinder.desktop
productName: View Finder
copyright: View Finder contributors
# No auto-update feed: builds are installed by hand.
publish: null
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - src/**/*
# The engine is the repository's Python package. It runs from a Python
# environment the app creates on first launch (src/runtime.js), not from
# inside the installer: PyTorch with CUDA alone is several GB.
extraResources:
  - from: ../viewfinder
    to: engine/viewfinder
    filter:
      - "**/*"
      - "!tests/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: View Finder
linux:
  target: AppImage
  category: Graphics
  icon: build/icon.png
