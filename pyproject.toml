[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "view-finder-geolocation"
version = "0.2.0"
description = "Local-first, fail-closed image and video geolocation CLI"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
view-finder = "viewfinder.cli:main"

[tool.setuptools.packages.find]
include = ["viewfinder*"]

# The World Engine's browser viewer ships as static files inside the package.
[tool.setuptools.package-data]
"viewfinder.world" = ["viewer/*.html", "viewer/*.css", "viewer/*.js"]
