paths:
  data_dir: data/airflow-smoke

tiling:
  mode: regions
  cell_size_degrees: 0.1
  max_tiles_per_run: 1
  regions:
    - name: airflow_smoke
      bounds: [-87.70, 41.85, -87.60, 41.95]

extract:
  page_size: 3
  max_images_per_tile: 3
  request_timeout_seconds: 5
  min_request_interval_seconds: 0
  max_http_attempts: 1
  backoff_base_seconds: 0

validate:
  perceptual_hash_distance: 2

transform:
  max_images_per_tile: 3
  blur_variance_threshold: 0
  exclude_likely_indoor: false
  embedding_model: ViT-B-32
  embedding_pretrained: laion2b_s34b_b79k
  embedding_batch_size_gpu: 8
  embedding_batch_size_cpu: 2

quality_check:
  minimum_total_images: 1
  expected_regions: []
  minimum_region_fraction: 0.01
